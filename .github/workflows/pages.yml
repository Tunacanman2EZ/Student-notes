# Publishes the app (and the organized library) to GitHub Pages every time main changes.
# Settings → Pages → Source must be "GitHub Actions" for this to run.
name: Publish the app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the logic tests
        run: node tests/run.js
      - name: Build the site and the library
        run: |
          mkdir -p _site
          cp -r index.html style.css js examples contributions _site/
          node tools/build-library.js _site
          node tools/stamp-version.js _site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
